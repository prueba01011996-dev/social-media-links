# These are supported funding model platforms

github: # Replace with up to 4 GitHub Sponsors-enabled usernames e.g., [user1, user2]
patreon: # Replace with a single Patreon username
open_collective: # Replace with a single Open Collective username
ko_fi: # Replace with a single Ko-fi username
tidelift: # Replace with a single Tidelift platform-name/package-name e.g., npm/babel
community_bridge: # Replace with a single Community Bridge project-name e.g., cloud-foundry
liberapay: # Replace with a single Liberapay username
issuehunt: # Replace with a single IssueHunt username
lfx_crowdfunding: # Replace with a single LFX Crowdfunding project-name e.g., cloud-foundry
polar: # Replace with a single Polar username
buy_me_a_coffee: # Replace with a single Buy Me a Coffee username
thanks_dev: # Replace with a single thanks.dev username
custom: # Replace with up to 4 custom sponsorship URLs e.g., ['link1', 'link2']
# Mostrando un botón de patrocinador en tu repositorio

Puede agregar un botón de patrocinador en el repositorio para aumentar la visibilidad de las opciones de financiación del proyecto de open source.

## Acerca de los archivos FUNDING

Puede configurar el botón de patrocinador si edita un archivo `FUNDING.yml` en la carpeta `.github` del repositorio, en la rama predeterminada. Puedes configurar el botón para que incluya programadores patrocinados en GitHub Sponsors, plataformas de financiamiento externo o URL de financiamiento personalizadas. Para más información sobre GitHub Sponsors, consulta [Acerca de los patrocinadores de GitHub](/es/sponsors/getting-started-with-github-sponsors/about-github-sponsors).

Puedes agregar un nombre de usuario, un nombre de paquete o un nombre de proyecto por plataforma de financiamiento externo y hasta cuatro URL personalizadas. Puede añadir una organización y hasta cuatro desarrolladores patrocinadores en GitHub Sponsors. Agrega cada plataforma en una línea nueva, usando la siguiente sintaxis:

| Plataforma | Sintaxis |
| ---------- | -------- |

[LFX Mentorship (antes CommunityBridge)](https://lfx.linuxfoundation.org/tools/mentorship) | `community_bridge: PROJECT-NAME`

[GitHub Sponsors](https://github.com/sponsors) |
`github: USERNAME` o `github: [USERNAME, USERNAME, USERNAME, USERNAME]`

[IssueHunt](https://issuehunt.io/) | `issuehunt: USERNAME`

[Ko-fi](https://ko-fi.com/) | `ko_fi: USERNAME`

[Liberapay](https://en.liberapay.com/) | `liberapay: USERNAME`

[Open Collective](https://opencollective.com/) | `open_collective: USERNAME`

[Patreon](https://www.patreon.com/) | `patreon: USERNAME`

[Tidelift](https://tidelift.com/) | `tidelift: PLATFORM-NAME/PACKAGE-NAME`

[Polar](https://www.polar.sh/) | `polar: USERNAME`

[Comprarme un café](https://www.buymeacoffee.com/) | `buy_me_a_coffee: USERNAME`

[thanks.dev](https://thanks.dev/) | `thanks_dev: u/gh/USERNAME`
Dirección URL personalizada |
`custom: LINK1` o `custom: [LINK1, LINK2, LINK3, LINK4]`

Para Tidelift, usa la sintaxis `platform-name/package-name` con los siguientes nombres de plataforma:

| Idioma     | Nombre de la plataforma. |
| ---------- | ------------------------ |
| JavaScript | `npm`                    |
| Python     | `pypi`                   |
| Ruby       | `rubygems`               |
| Java       | `maven`                  |
| PHP        | `packagist`              |
| C#         | `nuget`                  |

Este es un archivo `FUNDING.yml` de ejemplo:

```yaml
github: [octocat, surftocat]
patreon: octocat
tidelift: npm/octo-package
custom: ["https://www.paypal.me/octocat", octocat.com]
```

> [!NOTE]
> Si una dirección URL personalizada de una matriz incluye `:`, debes encerrar la dirección URL entre comillas. Por ejemplo, `"https://www.paypal.me/octocat"`.

Puedes crear un botón de patrocinador predeterminado para tu organización o cuenta personal. Para más información, consulta [Creación de un archivo predeterminado de mantenimiento de la comunidad](/es/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file).

> [!NOTE]
> Los enlaces de financiación proporcionan una manera para que los proyectos de código abierto reciban apoyo financiero directo de su comunidad. El uso de enlaces de financiamiento para otros fines, como la publicidad o el apoyo a grupos solidarios, comunitarios o políticos no está admitido. Si tienes consultas acerca de si los fines con que deseas usar estos enlaces están admitidos, ve a [Soporte de GitHub](https://support.github.com).

## Mostrando un botón de patrocinador en tu repositorio

Cualquier usuario que cuente con permisos de administración puede habilitar un botón de patrocinador en un repositorio.

1. En GitHub, navegue hasta la página principal del repositorio.

