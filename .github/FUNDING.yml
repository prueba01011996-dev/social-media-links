   ![Captura de pantalla de un encabezado de repositorio en el que se muestran las pestañas. La pestaña "Configuración" está resaltada con un contorno naranja oscuro.](/assets/images/help/repository/repo-actions-settings.png)

3. En la página de configuración "General", en la sección "Características", selecciona **Patrocinios**.

4. En el cuadro "Patrocinios", haz clic en el botón **Configurar patrocinador** o **Invalidar vínculos de financiación**.

5. En el editor de archivos, siga la instrucciones del archivo `FUNDING.yml` para agregar vínculos a las ubicaciones de financiación.

6. Haga clic en **Confirmar cambios**.

7. En el campo de "Mensaje de confirmación", escriba un mensaje de confirmación corto y significativo que describa la modificación que hizo en el archivo. Puedes atribuir el cambio a mas de un autor en el mensaje del mismo. Para más información, consulta [Creación de un commit con varios autores o en nombre de una organización](/es/pull-requests/how-tos/commit-changes/creating-a-commit-with-multiple-authors).

8. Debajo de los campos para el mensaje de confirmación, decide si deseas agregar tu confirmación a la rama actual o a una rama nueva. Debajo de los campos del mensaje de confirmación, decide si deseas agregar tu confirmación a la rama actual o a una nueva rama. Si tu rama actual es la rama predeterminada, debes elegir crear una nueva rama para tu confirmación y después crear una solicitud de extracción. Para más información, consulta [Crear una solicitud de incorporación de cambios](/es/pull-requests/how-tos/create-pull-requests/creating-a-pull-request).

   ![Captura de pantalla de una solicitud de extracción de GitHub que muestra un botón de opción para hacer la confirmación directamente en la rama principal o para crear una nueva rama. Aparece seleccionada la opción de rama nueva.](/assets/images/help/repository/choose-commit-branch.png)

9. Haz clic en **Confirmar cambios** o **Proponer cambios**.

